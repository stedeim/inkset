<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{TITLE}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      @page {
        size: {{PAGE_WIDTH_IN}}in {{PAGE_HEIGHT_IN}}in;
        margin: 0.75in 0.5in 0.75in 0.75in;
      }
      @page :left {
        margin-left: 0.5in;
        margin-right: 0.75in;
      }
      @page :right {
        margin-left: 0.75in;
        margin-right: 0.5in;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family: 'Lora', 'Crimson Pro', Georgia, 'Times New Roman', serif;
        font-size: 11pt;
        line-height: 1.3;
        color: #111;
      }

      p {
        margin: 0;
        text-align: justify;
        text-indent: 1.25em;
        orphans: 2;
        widows: 2;
      }

      p + p {
        margin-top: 0;
      }

      /* First paragraph after a heading is flush (no indent) — book convention. */
      h1 + p,
      h2 + p,
      .chapter-heading + p,
      .scene-break + p {
        text-indent: 0;
      }

      /* Drop cap — explicit <span class="drop-cap"> only.
         We do NOT use ::first-letter because Chromium can apply the
         pseudo-element in surprising ways when a paragraph contains
         inline elements or mid-paragraph line breaks. The span is emitted
         by paragraphsToHtml() in src/main/services/kdpFormatService.ts
         for the first character of the first paragraph of each chapter —
         nothing else. Geometry is shared with the canvas CSS in
         src/renderer/src/assets/main.css — keep them in sync. */
      p.chapter-opener {
        padding-left: 8px;
        text-indent: -8px;
      }
      .drop-cap {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 600;
        font-size: 4.5em;
        line-height: 0.85;
        float: left;
        margin-right: 0.08em;
        margin-top: 0.08em;
        margin-bottom: -0.1em;
        padding: 0;
        color: #8b5e3c;
      }

      .scene-break {
        text-align: center;
        margin: 1.2em 0;
        letter-spacing: 0.5em;
      }

      .page-break {
        page-break-before: always;
      }

      .title-page,
      .copyright-page,
      .dedication-page,
      .toc-page {
        page-break-after: always;
        text-align: center;
        padding-top: 2.5in;
      }

      .title-page h1 {
        font-size: 28pt;
        font-weight: 600;
        margin: 0 0 0.6em;
      }

      .title-page .subtitle {
        font-size: 14pt;
        font-style: italic;
        color: #444;
        margin-bottom: 1em;
      }

      .title-page .author {
        font-size: 14pt;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .copyright-page {
        padding-top: 5in;
        font-size: 9pt;
        color: #444;
        text-align: center;
      }

      .copyright-page p {
        text-indent: 0;
        text-align: center;
        margin-bottom: 0.6em;
      }

      .dedication-page {
        padding-top: 3.5in;
        font-style: italic;
      }

      .dedication-page p {
        text-indent: 0;
        text-align: center;
      }

      .toc-page {
        text-align: left;
        padding-top: 1in;
      }

      .toc-page h2 {
        text-align: center;
        font-size: 18pt;
        font-weight: 600;
        margin: 0 0 1em;
      }

      .toc-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .toc-list li {
        padding: 0.35em 0;
        border-bottom: 1px dotted #ccc;
      }

      .chapter {
        page-break-before: always;
      }

      .chapter-heading {
        text-align: center;
        font-size: 20pt;
        font-weight: 600;
        margin: 2.5in 0 1.5em;
        letter-spacing: 0.02em;
      }

      .chapter-heading .chapter-label {
        display: block;
        font-size: 10pt;
        font-weight: 400;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #666;
        margin-bottom: 0.5em;
      }
    </style>
  </head>
  <body>
    {{BODY_HTML}}
  </body>
</html>
